<div class="auth-container">
  <div class="auth-card">
    <h2>Login to DocBook</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input pInputText id="email" formControlName="email" placeholder="you@example.com" />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <small class="error">Valid email is required</small>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true"></p-password>
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <small class="error">Password is required</small>
        }
      </div>

      @if (errorMessage) {
        <p-message severity="error" [text]="errorMessage"></p-message>
      }

      <p-button
        type="submit"
        label="Login"
        [loading]="loading"
        [disabled]="loginForm.invalid"
        styleClass="w-full"
      ></p-button>
    </form>

    <p class="switch-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
